[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfblinder"
version = "0.1.0"
description = "Reconstruct and sanitize PDFs for anonymous review."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pikepdf>=10.17,<11"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "Pillow>=10"]

[project.scripts]
pdfblinder = "pdfblinder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
