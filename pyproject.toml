[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfblinder"
version = "0.2.0"
description = "Reconstruct and sanitize PDFs for anonymous review."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pikepdf>=10.17,<11", "Pillow>=10", "pypdf>=6.21,<7", "pypdfium2>=5.14,<6", "psutil>=7.2,<8"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "reportlab>=4.4,<5", "ruff>=0.14"]

[project.urls]
Homepage = "https://github.com/foivoskar/PDFblinder"
Issues = "https://github.com/foivoskar/PDFblinder/issues"

[project.scripts]
pdfblinder = "pdfblinder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.data-files]
"share/doc/pdfblinder" = ["SECURITY.md", "CHANGELOG.md", "docs/EDITORIAL_ACCEPTANCE.md", "docs/VALIDATION.md", "docs/DEPLOYMENT.md", "docs/THIRD_PARTY.md"]
