name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Ghostscript on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript

      - name: Install Ghostscript on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v gs >/dev/null 2>&1; then
            brew install ghostscript
          fi

      - name: Install Ghostscript on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ghostscript --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Ghostscript installation failed."
          }
          $gs = Get-ChildItem -Path "$env:ProgramFiles\gs" `
            -Filter gswin64c.exe -Recurse |
            Select-Object -First 1
          if (-not $gs) {
            throw "Ghostscript executable was not found."
          }
          $gs.DirectoryName |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install PDFblinder and test dependencies
        run: python -m pip install ".[dev]"

      - name: Show tool versions
        run: |
          python --version
          pdfblinder --version
          python -c "import subprocess; from pdfblinder.ghostscript import find_ghostscript; subprocess.run([find_ghostscript(), '--version'], check=True)"

      - name: Check code
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Check distribution packaging
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  container:
    name: Isolated Linux container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Generate synthetic input
        run: |
          python -m pip install pikepdf
          mkdir -p work/input work/output
          chmod 777 work/output
          python -c "import pikepdf; p=pikepdf.Pdf.new(); p.add_blank_page(page_size=(300,400)); p.save('work/input/sample.pdf')"
      - name: Build isolated image
        run: docker build -t pdfblinder:test .
      - name: Run without network or writable root
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 2g --memory-swap 2g --cpus 2 --pids-limit 64 --tmpfs "/work:rw,noexec,nosuid,size=768m,mode=700,uid=$(id -u),gid=$(id -g)" --mount type=bind,src="$PWD/work/input/sample.pdf",dst=/input.pdf,readonly --mount type=bind,src="$PWD/work/output",dst=/output pdfblinder:test /input.pdf /output/review.pdf
          python -c "import json; from pathlib import Path; r=json.loads(Path('work/output/review.pdf.audit.json').read_text()); assert r['technical_status']=='passed'; assert r['human_review']=='pending'; assert Path('work/output/review.pdf').is_file()"


  runtime-advisories:
    name: Runtime dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install runtime and advisory checker
        run: python -m pip install . pip-audit
      - name: Audit exact runtime dependency closure
        run: |
          python scripts/runtime_requirements.py work/runtime-requirements.txt
          python -m pip_audit --disable-pip --no-deps -r work/runtime-requirements.txt
